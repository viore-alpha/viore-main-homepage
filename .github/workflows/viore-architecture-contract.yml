name: Verify Viore architecture contract

on:
  pull_request:
    paths:
      - AGENTS.md
      - .github/copilot-instructions.md
      - .github/workflows/viore-architecture-contract.yml
      - .viore/**
  push:
    paths:
      - AGENTS.md
      - .github/copilot-instructions.md
      - .github/workflows/viore-architecture-contract.yml
      - .viore/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .viore/verify-contract.mjs
