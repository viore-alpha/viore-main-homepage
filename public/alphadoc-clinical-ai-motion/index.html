<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알파닥 · 임상용 AI 오프닝 모션</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
<style>

:root{
  --ad-bg:#F7F6F3;
  --ad-surface-1:rgba(255,255,255,0.78);
  --ad-surface-2:rgba(245,245,247,0.72);
  --ad-user-bubble:linear-gradient(180deg,#343437 0%,#171719 100%);
  --ad-border-soft:rgba(17,17,19,0.08);
  --ad-text-primary:#111113;
  --ad-text-secondary:rgba(17,17,19,0.66);
  --ad-text-tertiary:rgba(17,17,19,0.42);
  --ad-brand:#B42335;
  --ad-brand-deep:#8F182B;
  --ad-page-gradient:
    radial-gradient(circle at 50% -18%, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.58) 34%, transparent 58%),
    linear-gradient(180deg,#F7F6F3 0%,#FBFBFA 48%,#EFEEEB 100%);
  --ad-chat-max-width:880px;
  --ad-window-gap:8px;
  --ad-desktop-left:280px;
  --ad-glass-border:rgba(255,255,255,0.62);
  --ad-glass-border-soft:rgba(255,255,255,0.42);
  --ad-glass-field:linear-gradient(180deg,rgba(255,255,255,0.92) 0%,rgba(255,255,255,0.68) 100%);
  --ad-glass-header:
    linear-gradient(180deg,rgba(255,255,255,0.76) 0%,rgba(247,247,248,0.58) 100%),
    rgba(245,245,247,0.70);
  --ad-glass-shadow:0 18px 42px rgba(17,17,19,0.08),0 1px 0 rgba(255,255,255,0.76) inset;
  --ad-window-shadow:var(--ad-glass-shadow);
  --ad-ease-premium:cubic-bezier(0.2,0.8,0.2,1);
}
*{box-sizing:border-box;}
html,body{width:100%;margin:0;padding:0;overflow:hidden;}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  background:#E6E4DF;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:0;
}

.device{
  position:relative;
  width:min(840px,100vw);
  height:min(66.6667vw,560px);
  border-radius:28px;
  background:var(--ad-page-gradient);
  overflow:hidden;
  box-shadow:0 40px 120px rgba(35,24,21,0.22),0 8px 24px rgba(35,24,21,0.10);
  border:1px solid rgba(255,255,255,0.6);
}

.viewport{
  position:absolute;
  top:0;left:0;
  width:900px;height:640px;
  transform-origin:top left;

}

.device::before{
  display:none;
  content:"";position:absolute;left:0;right:0;top:0;height:12px;z-index:55;pointer-events:none;
  background:#FBFBFA;
}

.alpha-chat-header{
  position:absolute;
  display:none;
  left:var(--ad-window-gap);
  right:var(--ad-window-gap);
  top:var(--ad-window-gap);
  z-index:50;
  height:52px;
  border-radius:26px;
  background:
    linear-gradient(180deg,rgba(255,255,255,0.94) 0%,rgba(248,248,249,0.88) 100%),
    rgba(247,246,243,0.96);
  padding:0 16px;
  backdrop-filter:blur(40px) saturate(1.3);
  -webkit-backdrop-filter:blur(40px) saturate(1.3);
  box-shadow:var(--ad-window-shadow);
}
.alpha-chat-header-inner{display:flex;height:100%;align-items:center;justify-content:space-between;}
.alpha-brand{display:flex;align-items:center;gap:8px;}
.alpha-brand-symbol{height:28px;width:auto;display:block;}
.alpha-header-right{display:flex;align-items:center;gap:10px;}

.alpha-wing-btn{
  display:inline-flex;align-items:center;justify-content:center;height:36px;gap:7px;padding:0 13px 0 7px;
  border-radius:999px;border:0;background:rgba(255,255,255,0.94);
  color:rgba(29,29,31,0.72);font-size:13px;font-weight:600;line-height:1;
  box-shadow:0 8px 20px rgba(35,24,21,0.08),0 1px 0 rgba(255,255,255,0.86) inset;
}
.alpha-wing-btn .wing-mark{display:block;width:30px;height:30px;}
.alpha-alphadocs-wing-mark{position:relative;display:block;flex-shrink:0;overflow:visible;}
.alpha-alphadocs-wing-art{position:absolute;inset:0;display:block;transform-origin:27% 40%;transform:translateZ(0) rotate(-4deg);transition:opacity 280ms var(--ad-ease-premium),transform 280ms var(--ad-ease-premium);will-change:transform,opacity;}
.alpha-alphadocs-wing-art img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;}
.alpha-alphadocs-wing-mark.is-inactive .alpha-alphadocs-wing-art{filter:none;opacity:1;}
.alpha-wing-btn:hover .alpha-alphadocs-wing-mark.is-inactive .alpha-alphadocs-wing-art{opacity:1;}
.alpha-chat-header-button{
  display:inline-flex;height:38px;width:38px;align-items:center;justify-content:center;
  border-radius:999px;border:1px solid var(--ad-glass-border);background:var(--ad-glass-field);
  color:#2C2C2C;font-size:19px;
  box-shadow:0 8px 22px rgba(35,24,21,0.08),0 1px 0 rgba(255,255,255,0.84) inset;
}

.alpha-sidebar-handle{
  position:absolute;
  left:calc(var(--ad-window-gap) + 12px);
  top:20px;
  z-index:45;
  display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;
  border:0;border-radius:999px;color:rgba(29,29,31,0.58);
  background:
    linear-gradient(180deg,rgba(255,255,255,0.86),rgba(248,248,250,0.58)),
    linear-gradient(120deg,rgb(143 24 43 / 0.075),transparent 68%);
  box-shadow:0 16px 34px rgba(35,24,21,0.13),0 4px 12px rgba(35,24,21,0.07),0 1px 0 rgba(255,255,255,0.86) inset;
  opacity:0.72;
  backdrop-filter:blur(22px) saturate(1.16);
  -webkit-backdrop-filter:blur(22px) saturate(1.16);
}
.alpha-sidebar-handle .shine{position:absolute;inset:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0.40),rgba(255,255,255,0) 52%),radial-gradient(circle at 48% 8%,rgba(255,255,255,0.72),transparent 36%);opacity:0.72;}
.alpha-sidebar-handle i{position:relative;z-index:1;font-size:17px;}

.alpha-chat-scroll{
  position:absolute;left:0;right:0;top:0;bottom:0;
  overflow:hidden;
  padding-top:22px;
}
.alpha-chat-scroll::before{
  display:none;
  content:"";position:absolute;left:0;right:0;top:0;height:44px;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,#FBFBFA 30%,rgba(251,251,250,0.7) 65%,transparent 100%);
}

.alpha-chat-scroll.empty{display:flex;align-items:center;justify-content:center;padding-top:0;padding-bottom:88px;}
.alpha-chat-postcard{
  width:min(760px,calc(100% - 72px));
  margin:0 auto;
  padding-bottom:84px;
}

.alpha-empty-state{display:flex;width:100%;max-width:760px;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.alpha-empty-headline{display:inline-flex;width:100%;align-items:center;justify-content:center;gap:18px;}
.alpha-empty-padaki-logo{display:inline-flex;width:92px;height:92px;flex:0 0 92px;align-items:center;justify-content:center;filter:drop-shadow(0 14px 26px rgba(0,96,118,0.18));opacity:0;transform:scale(0.82) translateY(8px);}
.alpha-empty-padaki-logo.in{animation:padakiIn .7s var(--ad-ease-premium) both;}
.alpha-empty-padaki-logo svg,.alpha-empty-padaki-logo img{display:block;width:100%;height:100%;object-fit:contain;}
.alpha-empty-title{max-width:none;width:auto;font-size:38px;line-height:1.08;font-weight:720;letter-spacing:0;color:#2C2C2C;white-space:nowrap;}
.alpha-empty-title-line{display:inline-block;white-space:nowrap;}
.alpha-empty-caption{margin-top:14px;width:100%;font-size:15px;line-height:1.5;font-weight:450;letter-spacing:0;color:rgba(44,44,44,0.48);}
.alpha-empty-caption-line{display:block;white-space:nowrap;}
.alpha-empty-title-char,.alpha-empty-caption-char{display:inline-block;opacity:0;filter:blur(8px);transform:translate3d(0,12px,0);}
.alpha-empty-title-char.run{animation:emptyStream .52s cubic-bezier(0.16,1,0.3,1) forwards;}
.alpha-empty-caption-char.run{animation:emptyStream .5s cubic-bezier(0.16,1,0.3,1) forwards;}
.alpha-empty-suggestion-row{display:flex;justify-content:center;margin-top:26px;gap:16px;max-width:680px;flex-wrap:wrap;}
.alpha-empty-suggestion-chip{
  position:relative;isolation:isolate;overflow:hidden;
  width:132px;height:104px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:12px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,0.92),rgba(246,247,249,0.7)),rgba(255,255,255,0.5);
  border:1px solid rgba(255,255,255,0.7);
  color:#6E6E73;font-size:14px;line-height:18px;font-weight:720;
  box-shadow:0 12px 28px rgba(15,23,42,0.05),0 3px 10px rgba(15,23,42,0.032),0 1px 0 rgba(255,255,255,0.72) inset;
  backdrop-filter:blur(22px) saturate(0.9);-webkit-backdrop-filter:blur(22px) saturate(0.9);
  opacity:0;filter:blur(7px);transform:translate3d(0,9px,0);
}
.alpha-empty-suggestion-chip.in{animation:chipIn .76s cubic-bezier(0.16,1,0.3,1) forwards;}
.alpha-empty-suggestion-icon{
  display:inline-flex;width:46px;height:46px;flex:0 0 46px;align-items:center;justify-content:center;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,0.4),rgba(255,255,255,0.14)),rgba(118,118,128,0.08);
  filter:none;
}
.alpha-empty-suggestion-icon img{display:block;width:80%;height:80%;object-fit:contain;}

.alpha-user-row{display:flex;justify-content:flex-end;margin-bottom:24px;}
.alpha-user-shell{display:flex;max-width:min(88%,640px);flex-direction:column;align-items:flex-end;}
.alpha-user-shell--media{max-width:min(88%,520px);}
.alpha-user-bubble{
  position:relative;width:max-content;max-width:100%;
  padding:9px 14px 10px;background:var(--ad-user-bubble);
  border-radius:20px;border-bottom-right-radius:6px;
  color:#fff;font-size:14px;line-height:21px;font-weight:500;
  box-shadow:0 1px 0 rgba(255,255,255,0.10) inset;
}
.alpha-user-bubble::after{content:"";position:absolute;right:-5px;bottom:0;width:15px;height:17px;background:#171719;border-bottom-left-radius:16px;clip-path:polygon(0 8%,100% 100%,0 100%);}
.alpha-user-text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;}
.alpha-message-time{margin-top:8px;color:#B0AFAC;font-size:12px;line-height:16px;text-align:right;font-variant-numeric:tabular-nums;}
.alpha-user-attachments{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;width:100%;}
.alpha-user-image{width:240px;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.16);box-shadow:0 8px 22px rgba(0,0,0,0.18);background:#0d0d0f;}
.alpha-user-image img{display:block;width:100%;height:auto;}
.alpha-doc-card{display:flex;align-items:center;gap:10px;width:260px;max-width:100%;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,#3a3a3d,#1c1c1f);border:1px solid rgba(255,255,255,0.12);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,0.18);}
.alpha-doc-card .doc-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#FF6B6B;font-size:18px;flex-shrink:0;}
.alpha-doc-card .doc-name{font-size:12px;font-weight:700;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alpha-doc-card .doc-sub{font-size:9px;font-weight:600;color:rgba(255,255,255,0.46);margin-top:2px;}

.alpha-exchange{margin-bottom:22px;}
.alpha-answer{max-width:100%;color:var(--ad-text-primary);text-align:left;}
.alpha-answer .markdown-body{max-width:820px;line-height:1.64;}
.alpha-md-h2{margin:2px 0 8px;font-size:16px;line-height:23px;font-weight:760;color:#1D1D1F;}
.alpha-md-h3{margin:14px 0 6px;font-size:14px;line-height:21px;font-weight:720;color:#1D1D1F;}
.alpha-md-paragraph{margin:0 0 10px;color:#1D1D1F;font-size:14.5px;line-height:23px;font-weight:430;}
.alpha-md-strong{color:#111113;font-weight:760;}
.alpha-md-list{display:grid;gap:7px;margin:9px 0 11px;padding-left:0;list-style:none;}
.alpha-md-li{position:relative;color:#252527;font-size:14px;line-height:22px;font-weight:430;padding-left:18px;}
.alpha-md-li::before{content:"";position:absolute;left:2px;top:0.72em;width:5px;height:5px;border-radius:999px;background:#8E8E93;box-shadow:0 0 0 3px rgba(29,29,31,0.045);}
.alpha-citation-pill{display:inline-flex;height:18px;align-items:center;gap:3px;margin:0 3px;padding:0 7px;vertical-align:0.08em;border:1px solid rgba(29,29,31,0.08);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,0.96),rgba(245,245,247,0.9));color:#1D1D1F;font-size:9.5px;line-height:1;font-weight:760;box-shadow:0 5px 14px rgba(0,0,0,0.045),0 1px 0 rgba(255,255,255,0.92) inset;}
.alpha-source-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:11px;margin-bottom:6px;}
.alpha-source-row::before{content:"출처";display:inline-flex;height:26px;align-items:center;color:#8A8A91;font-size:10px;font-weight:760;}
.alpha-source-chip{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,0.96),rgba(245,245,247,0.86)),rgba(255,255,255,0.72);border:1px solid rgba(29,29,31,0.08);color:#1D1D1F;font-size:10.5px;line-height:16px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,0.055),0 1px 0 rgba(255,255,255,0.90) inset;}
.alpha-source-chip i{font-size:13px;}
.alpha-message-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:28px;}
.alpha-message-actions-bar{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:var(--ad-glass-field);border:1px solid var(--ad-glass-border-soft);box-shadow:0 1px 2px rgba(0,0,0,0.05);}
.alpha-message-action-btn{display:grid;width:32px;height:32px;place-items:center;border-radius:999px;color:#6B6B6B;font-size:15px;}
.alpha-message-actions-divider{width:1px;height:16px;margin:0 2px;background:rgba(0,0,0,0.08);}
.alpha-message-actions-time{font-size:12px;color:#B0AFAC;font-variant-numeric:tabular-nums;}

.alpha-thinking{display:inline-flex;align-items:center;gap:8px;margin-top:6px;color:#2C2C2C;font-size:13px;line-height:20px;font-weight:520;}
.alpha-thinking-orb{width:9px;height:9px;border-radius:999px;background:radial-gradient(circle,#FFFFFF 0%,#F5E6EA 34%,#B42335 72%);box-shadow:0 0 18px rgba(180,35,53,0.34),0 0 28px rgba(143,24,43,0.14);animation:alphaOrbPulse 1.25s ease-in-out infinite;}

.alpha-composer-dock{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:12px 28px 18px;}
.alpha-composer-dock::before{content:'';position:absolute;left:0;right:0;top:-40px;bottom:0;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.38) 42%,rgba(255,255,255,0.66) 100%);}
.alpha-attachment-preview{width:100%;max-width:var(--ad-chat-max-width);margin:0 auto 10px;}
.alpha-attachment-preview-inner{display:flex;gap:8px;}
.alpha-attachment-chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:14px;background:linear-gradient(180deg,#3a3a3d,#1c1c1f);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 20px rgba(0,0,0,0.16);}
.alpha-attachment-thumb{width:30px;height:30px;border-radius:8px;object-fit:cover;display:grid;place-items:center;color:#fff;flex-shrink:0;}
.alpha-attachment-thumb.doc{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);font-size:16px;}
.alpha-attachment-chip .a-name{font-size:10px;font-weight:700;color:#fff;line-height:14px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alpha-attachment-chip .a-sub{font-size:8px;font-weight:700;color:rgba(255,255,255,0.42);text-transform:uppercase;margin-top:1px;}
.alpha-attachment-remove{margin-left:2px;width:18px;height:18px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,0.12);color:#fff;font-size:11px;}
.alpha-composer{width:100%;max-width:var(--ad-chat-max-width);margin:0 auto;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:end;}
.alpha-composer-button{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--ad-glass-field);border:1px solid var(--ad-glass-border-soft);color:rgba(29,29,31,0.62);box-shadow:0 1px 2px rgba(0,0,0,0.06);font-size:20px;transition:background .12s ease,color .12s ease,border-color .12s ease;}
.alpha-composer-button.is-send-ready{background:#1D1D1F;border-color:rgba(0,0,0,0.14);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.12);}
.alpha-composer-button.is-send-idle{color:rgba(29,29,31,0.42);}
.alpha-input-shell{position:relative;min-height:44px;border-radius:28px;overflow:hidden;background:var(--ad-glass-field);border:1px solid var(--ad-glass-border-soft);box-shadow:0 18px 42px rgba(17,17,19,0.08),0 1px 0 rgba(255,255,255,0.76) inset;transition:border-color .18s,box-shadow .18s;}
.alpha-input-shell.focused{border-color:rgba(0,0,0,0.14);box-shadow:0 1px 2px rgba(0,0,0,0.06),0 8px 24px rgba(0,0,0,0.08),0 0 0 4px rgba(180,35,53,0.075);}
.alpha-input{display:block;width:100%;min-height:42px;border:none;outline:none;background:transparent;padding:11px 18px 9px;color:#2C2C2C;font-size:14px;line-height:20px;font-weight:500;font-family:inherit;}
.alpha-input .ph{color:rgba(44,44,44,0.54);font-weight:450;}
.alpha-caret{display:inline-block;width:1.5px;height:16px;margin-left:1px;vertical-align:-3px;background:#2C2C2C;animation:caretBlink .9s steps(1) infinite;}
.alpha-medical-notice{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;color:var(--ad-text-secondary);}
.alpha-medical-notice .info{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--ad-border-soft);background:#fff;color:#111;font-size:11px;}
.streaming-cursor{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:#1D1D1F;border-radius:1px;animation:caretBlink .8s steps(1) infinite;}

.fx{opacity:0;}
.fx.in{animation:alphaAnswerIn .42s var(--ad-ease-premium) both;}
.fx-card.in{animation:alphaCardIn .42s var(--ad-ease-premium) both;}
.fx-src.in{animation:alphaSourceIn .42s var(--ad-ease-premium) both;}

@keyframes alphaAnswerIn{from{opacity:0;transform:translateY(8px);filter:blur(3px);}to{opacity:1;transform:translateY(0);filter:blur(0);}}
@keyframes alphaSourceIn{from{opacity:0;transform:translateY(5px) scale(0.99);filter:blur(2px);}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}
@keyframes alphaCardIn{from{opacity:0;transform:translateY(10px) scale(0.985);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes alphaOrbPulse{0%,100%{transform:scale(0.86);opacity:0.62;}50%{transform:scale(1.15);opacity:1;}}
@keyframes caretBlink{0%,50%{opacity:1;}50.01%,100%{opacity:0;}}
@keyframes padakiIn{0%{opacity:0;transform:scale(0.82) translateY(8px);filter:blur(6px);}70%{opacity:1;filter:blur(0);}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}}
@keyframes emptyStream{0%{opacity:0;filter:blur(8px);transform:translate3d(0,12px,0);}72%{opacity:1;filter:blur(0);}100%{opacity:1;filter:blur(0);transform:translate3d(0,0,0);}}
@keyframes chipIn{0%{opacity:0;filter:blur(7px);transform:translate3d(0,9px,0);}68%{opacity:1;filter:blur(0);}100%{opacity:1;filter:blur(0);transform:translate3d(0,0,0);}}

@media (prefers-reduced-motion: reduce){
  .fx,.fx-card,.fx-src{animation:none!important;opacity:1!important;transform:none!important;filter:none!important;}

    border-radius:24px;

  .viewport{
    width:430px;
    height:560px;
  }
  .alpha-chat-header{
    height:48px;
    padding:0 11px;

    width:34px;
    padding:0;
  }
  .alpha-chat-header-button{
    width:34px;
    height:34px;
    font-size:17px;
  }
  .alpha-sidebar-handle{
    display:none;
  }
  .alpha-chat-scroll{
    top:0;
    padding-top:0;
  }
  .alpha-chat-scroll.empty{
    padding-bottom:56px;
  }
  .alpha-medical-notice{
    display:none;
  }
  .alpha-empty-state{
    max-width:390px;
    transform:translateY(10px);
  }
  .alpha-empty-headline{
    flex-direction:column;
    gap:12px;
  }
  .alpha-empty-title{
    width:100%;
    font-size:27px;
    line-height:1.16;
    white-space:normal;
  }
  .alpha-empty-title-line{
    white-space:normal;
  }
  .alpha-empty-caption-line{
    white-space:normal;
  }
  .alpha-empty-padaki-logo{

    height:66px;
    flex-basis:66px;

  .alpha-empty-caption{
    margin-top:10px;
    font-size:13px;

    height:82px;

    font-size:12px;
    line-height:15px;

  .alpha-empty-suggestion-icon{
    width:34px;
    height:34px;

    border-radius:12px;

      <form class="alpha-composer" onsubmit="return false;">
        <button type="button" class="alpha-composer-button fx" id="c-attach"><i class="ri-attachment-2"></i></button>
        <div class="alpha-input-shell fx" id="inputShell">
          <div class="alpha-input"><span id="inputText"></span><span class="ph" id="inputPh">메시지를 입력하세요...</span></div>
        </div>
        <button type="button" class="alpha-composer-button is-send-idle fx" id="c-send"><i class="ri-arrow-up-line"></i></button>
      </form>
      <div class="alpha-medical-notice fx" id="notice">
        <span>알파닥의 답변은 의료인께서 판단하시는 데 참고로만 사용해 주세요.</span>
        <span class="info"><i class="ri-information-line"></i></span>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id)=>document.getElementById(id);
const sleep = (ms)=>new Promise(r=>setTimeout(r, ms));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// 내부 실제 UI viewport를 외부 임베드 프레임 폭에 맞춰 스케일
function fitViewport(){
  const dev = $('device');
  const vp = $('viewport');
  const s = dev.clientWidth / vp.offsetWidth;
  vp.style.transform = `scale(${s})`;
  vp.style.height = (dev.clientHeight / s) + 'px';
}
window.addEventListener('resize', fitViewport);

const thread = $('thread');
const inputText = $('inputText');
const inputPh = $('inputPh');
const inputShell = $('inputShell');
const sendBtn = $('c-send');
const scroll = $('scroll');

// 헤더/입력 도크 오프닝 순서
const chromeOrder = ['h-symbol','h-wing','h-bell','h-profile','h-handle','c-attach','inputShell','c-send','notice'];

// Empty State streaming 텍스트 채우기
function fillStreamText(el, text, baseDelayMs, perCharMs){
  el.innerHTML='';
  Array.from(text).forEach((ch,i)=>{
    const sp=document.createElement('span');
    sp.className='alpha-empty-title-char';
    sp.textContent = ch===' '?'\u00A0':ch;
    sp.style.animationDelay = (baseDelayMs + i*perCharMs) + 'ms';
    el.appendChild(sp);
  });
}
function runStreamText(el){ el.querySelectorAll('span').forEach(s=>s.classList.add('run')); }

async function playOpening(){
  // 1) 헤더·입력창 chrome 등장
  for(let i=0;i<chromeOrder.length;i++){
    $(chromeOrder[i]).classList.add('in');
    await sleep(reduceMotion?0:80);
  }
  await sleep(reduceMotion?0:200);
  // 2) 파닥이 마스코트 등장
  $('e-padaki').classList.add('in');
  await sleep(reduceMotion?0:340);
  // 3) 헤드라인 글자 스트리밍
  fillStreamText($('e-title'), '오늘도 도와드릴 준비가 되었어요.', 0, 28);
  runStreamText($('e-title'));
  await sleep(reduceMotion?0:1000);
  // 4) 서브타이틀 두 줄 스트리밍
  fillStreamText($('e-cap1'), '알파닥은 아래뿐만 아니라 더 많은 것을 할 수 있답니다.', 0, 16);
  $('e-cap1').querySelectorAll('span').forEach(s=>{s.className='alpha-empty-caption-char';});
  $('e-cap1').querySelectorAll('span').forEach(s=>s.classList.add('run'));
  await sleep(reduceMotion?0:520);
  fillStreamText($('e-cap2'), '의학 질문을 물어봐 주세요.', 0, 16);
  $('e-cap2').querySelectorAll('span').forEach(s=>{s.className='alpha-empty-caption-char';});
  $('e-cap2').querySelectorAll('span').forEach(s=>s.classList.add('run'));
  await sleep(reduceMotion?0:680);
  // 5) 추천 카드 순차 등장
  const cards = $('e-cards').querySelectorAll('.alpha-empty-suggestion-chip');
  for(let i=0;i<cards.length;i++){
    cards[i].classList.add('in');
    await sleep(reduceMotion?0:110);
  }
}

async function typeQuestion(text){
  inputShell.classList.add('focused');
  inputPh.style.display='none';
  inputText.textContent='';
  const caret=document.createElement('span');caret.className='alpha-caret';
  inputShell.querySelector('.alpha-input').appendChild(caret);
  const speed=reduceMotion?0:34;
  for(const ch of text){ inputText.textContent+=ch; await sleep(speed+(Math.random()*22|0)); }
  await sleep(reduceMotion?0:260);
  caret.remove();
  sendBtn.classList.remove('is-send-idle');sendBtn.classList.add('is-send-ready');
  await sleep(reduceMotion?0:240);
}

// Empty State 숨기고 대화 스레드로 전환
function enterChat(){
  $('emptyState').style.display='none';
  scroll.classList.remove('empty');
  thread.style.display='';
}

function addUserMessage({text,time,images=[],docs=[]}){
  const row=document.createElement('div');row.className='alpha-user-row';
  let att='';
  if(images.length||docs.length){
    att='<div class="alpha-user-attachments">';
    images.forEach(src=>att+=`<div class="alpha-user-image"><img src="${src}" alt=""/></div>`);
    docs.forEach(d=>att+=`<div class="alpha-doc-card"><span class="doc-icon"><i class="ri-file-pdf-2-fill"></i></span><span class="doc-meta"><span class="doc-name">${d.name}</span><span class="doc-sub">${d.sub}</span></span></div>`);
    att+='</div>';
  }
  row.innerHTML=`<div class="alpha-user-shell ${images.length||docs.length?'alpha-user-shell--media':''}"><div class="alpha-user-bubble">${att}<div class="alpha-user-text">${text}</div></div><p class="alpha-message-time">${time}</p></div>`;
  thread.appendChild(row);requestAnimationFrame(()=>row.classList.add('in'));scrollBottom();
}
function scrollBottom(){scroll.scrollTop=scroll.scrollHeight;}
function clearInput(){inputText.textContent='';inputPh.style.display='';inputShell.classList.remove('focused');sendBtn.classList.remove('is-send-ready');sendBtn.classList.add('is-send-idle');$('attachPreview').style.display='none';$('attachInner').innerHTML='';}
function addThinking(label){const ex=document.createElement('div');ex.className='alpha-exchange';ex.innerHTML=`<div class="alpha-thinking"><span class="alpha-thinking-orb"></span><span>${label}</span></div>`;thread.appendChild(ex);scrollBottom();return ex;}

async function streamAnswer(exNode,blocks,sources){
  const answer=document.createElement('div');answer.className='alpha-answer';
  const body=document.createElement('div');body.className='markdown-body';answer.appendChild(body);
  exNode.innerHTML='';exNode.appendChild(answer);
  const cursor=document.createElement('span');cursor.className='streaming-cursor';
  for(let b=0;b<blocks.length;b++){
    const block=blocks[b];const node=document.createElement(block.tag);node.className=block.cls;body.appendChild(node);body.appendChild(cursor);
    if(block.html){node.innerHTML=block.html;node.style.opacity=0;node.style.transition='opacity .18s';requestAnimationFrame(()=>node.style.opacity=1);await sleep(reduceMotion?0:(block.pause||220));}
    else{const text=block.text;const step=reduceMotion?text.length:3;for(let i=0;i<text.length;i+=step){node.textContent=text.slice(0,i+step);body.appendChild(cursor);scrollBottom();await sleep(reduceMotion?0:16);}node.textContent=text;}
    scrollBottom();await sleep(reduceMotion?0:90);
  }
  cursor.remove();
  if(sources&&sources.length){const srow=document.createElement('div');srow.className='alpha-source-row fx-src';srow.innerHTML=sources.map(s=>`<span class="alpha-source-chip"><i class="ri-links-line"></i>${s}</span>`).join('');answer.appendChild(srow);requestAnimationFrame(()=>srow.classList.add('in'));await sleep(reduceMotion?0:200);}
  const actions=document.createElement('div');actions.className='alpha-message-actions fx-src';
  actions.innerHTML=`<div class="alpha-message-actions-bar"><span class="alpha-message-action-btn"><i class="ri-file-copy-line"></i></span><span class="alpha-message-action-btn"><i class="ri-bookmark-line"></i></span><span class="alpha-message-actions-divider"></span><span class="alpha-message-action-btn"><i class="ri-thumb-up-line"></i></span><span class="alpha-message-action-btn"><i class="ri-thumb-down-line"></i></span></div><time class="alpha-message-actions-time">${exNode.dataset.time||''}</time>`;
  exNode.appendChild(actions);requestAnimationFrame(()=>actions.classList.add('in'));scrollBottom();
}

function showAttachPreview(){
  $('attachInner').innerHTML=`
    <div class="alpha-attachment-chip"><img class="alpha-attachment-thumb" src="alphadoc_clinical_ai_chat_motion_assets/chest-xray-preview.svg" alt=""/><div><div class="a-name">chest_xray_PA.png</div><div class="a-sub">PNG</div></div><span class="alpha-attachment-remove"><i class="ri-close-line"></i></span></div>
    <div class="alpha-attachment-chip"><span class="alpha-attachment-thumb doc"><i class="ri-file-pdf-2-fill"></i></span><div><div class="a-name">Fleischner_2017.pdf</div><div class="a-sub">PDF · 1.2MB</div></div><span class="alpha-attachment-remove"><i class="ri-close-line"></i></span></div>`;
  $('attachPreview').style.display='';
}

const Q1="GLP-1 RA가 제2형 당뇨 환자에서 MACE를 얼마나 줄이는지 RCT 근거로 정리해줘.";
const A1=[
  {tag:'h2',cls:'alpha-md-h2',text:'GLP-1 RA의 심혈관 보호 효과'},
  {tag:'p',cls:'alpha-md-paragraph',html:'대규모 CVOT에서 GLP-1 수용체 작용제는 <b class="alpha-md-strong">3-point MACE를 일관되게 감소</b>시켰습니다. ASCVD 동반 또는 고위험군에서 이득이 가장 뚜렷합니다.',pause:420},
  {tag:'h3',cls:'alpha-md-h3',text:'주요 RCT 결과'},
  {tag:'ul',cls:'alpha-md-list',html:'<li class="alpha-md-li"><b class="alpha-md-strong">LEADER</b>: MACE 13% 감소 (HR 0.87) <span class="alpha-citation-pill">NEJM 2016</span></li><li class="alpha-md-li"><b class="alpha-md-strong">SUSTAIN-6</b>: MACE 26% 감소 (HR 0.74) <span class="alpha-citation-pill">NEJM 2016</span></li><li class="alpha-md-li"><b class="alpha-md-strong">REWIND</b>: MACE 12% 감소 (HR 0.88) <span class="alpha-citation-pill">Lancet 2019</span></li>',pause:560},
  {tag:'p',cls:'alpha-md-paragraph',html:'임상적으로는 HbA1c와 별개로 <b class="alpha-md-strong">심혈관 고위험 제2형 당뇨 환자</b>에서 우선 고려할 수 있습니다.',pause:320}
];
const A1s=['Marso SP, et al. NEJM 2016','Gerstein HC, et al. Lancet 2019','ADA Standards of Care 2025'];

const Q2="첨부한 흉부 X-ray와 논문을 같이 보고, 8mm 폐결절 추적 계획을 정리해줘.";
const A2=[
  {tag:'h2',cls:'alpha-md-h2',text:'첨부 영상·논문 기반 추적 계획'},
  {tag:'p',cls:'alpha-md-paragraph',html:'첨부 X-ray와 Fleischner 기준을 함께 보면 <b class="alpha-md-strong">8mm 고형 폐결절</b>은 우선 저선량 흉부 CT로 크기와 성상을 확인하는 흐름이 적절합니다.',pause:420},
  {tag:'ul',cls:'alpha-md-list',html:'<li class="alpha-md-li"><b class="alpha-md-strong">저위험</b>: 6–12개월 CT 후 18–24개월 재평가 <span class="alpha-citation-pill">Fleischner 2017</span></li><li class="alpha-md-li"><b class="alpha-md-strong">고위험</b>: 6–12개월 CT, 이후 12개월 간격 추적</li><li class="alpha-md-li">이전 영상과 비교해 <b class="alpha-md-strong">크기 증가 여부</b>를 먼저 확인합니다.</li>',pause:560},
  {tag:'p',cls:'alpha-md-paragraph',html:'PET-CT는 임상 의심도와 CT 소견을 종합해 고려합니다. 최종 판단은 원본 영상 판독과 환자 위험인자를 함께 반영해야 합니다.',pause:320}
];
const A2s=['MacMahon H, et al. Radiology 2017 (Fleischner)','첨부: chest_xray_PA.png','첨부: Fleischner_2017.pdf'];

async function runSequence(){
  // reset
  thread.innerHTML='';thread.style.display='none';
  $('emptyState').style.display='';scroll.classList.add('empty');
  clearInput();
  chromeOrder.forEach(id=>$(id).classList.remove('in'));
  $('e-padaki').classList.remove('in');
  ['e-title','e-cap1','e-cap2'].forEach(id=>$(id).innerHTML='');
  $('e-cards').querySelectorAll('.alpha-empty-suggestion-chip').forEach(c=>c.classList.remove('in'));

  await sleep(reduceMotion?0:300);
  // 1) 오프닝 (Empty State 물 흐르듯 등장)
  await playOpening();
  // 2) 짧은 퍼즈
  await sleep(reduceMotion?0:900);

  // 3) 질문1 타이핑 → 대화 진입
  await typeQuestion(Q1);
  enterChat();
  addUserMessage({text:Q1,time:'오전 9:24'});
  clearInput();
  await sleep(reduceMotion?0:260);
  const ex1=addThinking('근거 문헌 검토 중...');ex1.dataset.time='오전 9:24';
  await sleep(reduceMotion?0:1100);
  await streamAnswer(ex1,A1,A1s);

  await sleep(reduceMotion?0:1500);

  // 4) 질문2 — 실제 첨부 프리뷰 UI로 논문+이미지 업로드 후 질문
  showAttachPreview();
  await sleep(reduceMotion?0:700);
  await typeQuestion(Q2);
  const uploadedImage = $('attachInner').querySelector('img')?.src;
  addUserMessage({
    text:Q2,
    time:'오전 9:31',
    images: uploadedImage ? [uploadedImage] : [],
    docs:[{name:'Fleischner_2017.pdf',sub:'PDF · 1.2MB'}]
  });
  clearInput();
  await sleep(reduceMotion?0:260);
  const ex2=addThinking('첨부 영상·논문 분석 중...');ex2.dataset.time='오전 9:31';
  await sleep(reduceMotion?0:1200);
  await streamAnswer(ex2,A2,A2s);

  await sleep(reduceMotion?0:3600);
  await sleep(reduceMotion?0:1300);
  runSequence();
}

window.addEventListener('load', ()=>{ fitViewport(); runSequence(); });
fitViewport();
</script>
</body>
</html>
